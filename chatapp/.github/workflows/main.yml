name: Java CI with Tests

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Download JUnit
      run: |
        curl -L -o junit-platform-console-standalone.jar https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.9.2/junit-platform-console-standalone-1.9.2.jar
        
    - name: Compile Code and Tests
      run: |
        javac -cp .:junit-platform-console-standalone.jar chatapp/*.java
        
    - name: Run Tests
      run: |
        java -jar junit-platform-console-standalone.jar --class-path . --scan-class-path
